<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>R_HMT responsive QA</title><style>*{box-sizing:border-box}body{margin:0;background:#101313;color:#d9d9cf;font:12px Arial}header{display:flex;gap:10px;align-items:center;padding:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10;background:#151d1a}button,select,a{font:inherit;padding:9px;border:1px solid #56634b;background:#263229;color:#dfdfca;text-decoration:none}iframe{display:block;border:0;width:390px;height:844px}output{display:block;white-space:pre-wrap;max-width:1200px;font:11px/1.6 monospace;padding:15px}main{width:max-content;position:fixed;left:0;top:60px;z-index:1}.qa-log{border-top:1px solid #64705f;max-width:1200px}</style></head><body><header><label>Viewport <select id="size"><option value="360,780">360 × 780</option><option value="390,844" selected>390 × 844</option><option value="768,1024">768 × 1024</option><option value="1440,900">1440 × 900</option></select></label><label>Section <select id="section"><option>home</option><option>about</option><option>journey</option><option>ecosystem</option><option>archive</option><option>lab</option><option>people</option><option>universe</option><option>ethos</option><option>contact</option></select></label><button id="audit">Audit layout</button><button id="stats">Read performance</button><button id="full">Full document</button><a href="/" target="_blank">Open site</a></header><main><iframe id="preview" src="/" title="Portfolio at selected viewport" allow="fullscreen; autoplay"></iframe></main><div class="qa-log"><output id="report">Loading…</output></div><script>
const frame=document.querySelector('iframe');const size=document.querySelector('#size');const section=document.querySelector('#section');const initialSize=new URLSearchParams(location.search).get('size');if([...size.options].some(o=>o.value===initialSize))size.value=initialSize;const report=document.querySelector('#report');let perf={cls:0,lcp:null,events:[]};
function resize(){const [w,h]=size.value.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';const scale=Math.min(1,(window.innerWidth-20)/w,(window.innerHeight-80)/h);frame.style.transformOrigin='top left';frame.style.transform='scale('+scale+')';frame.parentElement.style.width=(w*scale)+'px';frame.parentElement.style.height=(h*scale)+'px';report.textContent='Viewport '+w+' × '+h+'; capture scale '+scale;}
size.addEventListener('change',resize);section.addEventListener('change',()=>{frame.contentWindow.document.getElementById(section.value)?.scrollIntoView({behavior:'instant',block:'start'});});
frame.addEventListener('load',()=>{resize();const w=frame.contentWindow;const d=w.document;perf={cls:0,lcp:null,events:[],errors:[]};w.addEventListener('error',e=>perf.errors.push(e.message));try{new w.PerformanceObserver(list=>{for(const e of list.getEntries())perf.lcp=e.startTime;}).observe({type:'largest-contentful-paint',buffered:true});new w.PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput){perf.cls+=e.value;perf.events.push({value:e.value,time:e.startTime,sources:e.sources?.map(s=>({node:s.node?.className||s.node?.nodeName,before:s.previousRect.toJSON(),after:s.currentRect.toJSON()}))});}}).observe({type:'layout-shift',buffered:true});}catch{};report.textContent='Loaded. Browser: '+w.navigator.userAgent;});
document.querySelector('#audit').onclick=()=>{const d=frame.contentDocument;const all=[...d.querySelectorAll('body *')];const ww=d.documentElement.clientWidth;report.textContent=JSON.stringify({viewport:{width:ww,height:frame.clientHeight},captureScale:frame.getBoundingClientRect().width/frame.clientWidth,documentWidth:d.documentElement.scrollWidth,overflow:all.filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&getComputedStyle(e).position!=='fixed'&&(r.right>ww+1||r.left< -1)&&e.closest('.work-cover,.scene,.anime-card,.phone-study,.sr-only,.skip-link')===null;}).slice(0,20).map(e=>({tag:e.tagName,class:e.className})),brokenImages:[...d.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.src),canvases:d.querySelectorAll('canvas').length,sections:d.querySelectorAll('main section[id]').length,headings:d.querySelectorAll('h1').length},null,2);};
document.querySelector('#stats').onclick=()=>{const w=frame.contentWindow;report.textContent=JSON.stringify({browser:w.navigator.userAgent,reducedMotion:w.matchMedia('(prefers-reduced-motion: reduce)').matches,deviceMemory:w.navigator.deviceMemory,metrics:perf,resources:w.performance.getEntriesByType('resource').map(x=>({url:x.name.split('/').pop(),transfer:x.transferSize,duration:Math.round(x.duration)}))},null,2);};
document.querySelector('#full').onclick=()=>{frame.style.height=frame.contentDocument.documentElement.scrollHeight+'px';frame.contentWindow.scrollTo(0,0);};
</script></body></html>
